<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartBudget AI — Console</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --border: #e2e5ea;
            --text: #1a1d21;
            --muted: #6b7280;
            --accent: #2563eb;
            --user: #eef2ff;
            --ai: #f0fdf4;
            --danger: #dc2626;
            --ok: #16a34a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1115;
                --panel: #171a20;
                --border: #2a2f38;
                --text: #e6e8eb;
                --muted: #9aa3af;
                --accent: #60a5fa;
                --user: #1e2537;
                --ai: #12241a;
                --danger: #f87171;
                --ok: #4ade80;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .wrap { max-width: 780px; margin: 0 auto; padding: 24px 16px 60px; }

        header { margin-bottom: 20px; }

        h1 { font-size: 1.5rem; margin: 0 0 4px; }

        .sub { color: var(--muted); font-size: 0.9rem; margin: 0; }

        .status {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.8rem; color: var(--muted); margin-top: 8px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
        .dot.on { background: var(--ok); }
        .dot.off { background: var(--danger); }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .row { display: flex; gap: 8px; }

        input[type=text] {
            flex: 1; padding: 11px 13px; font-size: 0.95rem;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg); color: var(--text);
        }

        input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

        button {
            padding: 11px 18px; font-size: 0.95rem; font-weight: 500;
            border: 0; border-radius: 8px; cursor: pointer;
            background: var(--accent); color: #fff;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        button.mic { width: 100%; padding: 16px; font-size: 1.05rem; }
        button.mic.rec { background: var(--danger); }

        .hint { font-size: 0.82rem; color: var(--muted); margin: 10px 0 0; }

        .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

        .chip {
            font-size: 0.8rem; padding: 5px 10px; border-radius: 999px;
            border: 1px solid var(--border); background: transparent;
            color: var(--muted); cursor: pointer; font-weight: 400;
        }

        .chip:hover { color: var(--text); border-color: var(--accent); }

        .msg { padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; }
        .msg.user { background: var(--user); }
        .msg.ai { background: var(--ai); }
        .msg.err { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .who { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
        .msg p { margin: 0; white-space: pre-wrap; }
        .heard { font-size: 0.8rem; color: var(--muted); font-style: italic; margin-top: 6px; }
        audio { width: 100%; margin-top: 10px; }
        .empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 24px 0; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>SmartBudget AI</h1>
        <p class="sub">Console de demonstração — fale ou escreva um comando financeiro.</p>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">verificando API…</span></div>
    </header>

    <div class="panel">
        <button class="mic" id="micBtn">🎙️ Gravar comando de voz</button>
        <p class="hint" id="micHint">Clique, fale e clique de novo para enviar. O navegador vai pedir permissão do microfone.</p>
    </div>

    <div class="panel">
        <div class="row">
            <input type="text" id="txt" placeholder="Ex.: Registre uma despesa de 85 reais com Uber" autocomplete="off">
            <button id="sendBtn">Enviar</button>
        </div>
        <div class="examples" id="examples"></div>
    </div>

    <div id="log"><div class="empty">Nenhuma interação ainda.</div></div>
</div>

<script>
    const API = '/api/v1';
    const log = document.getElementById('log');
    const txt = document.getElementById('txt');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');

    const EXAMPLES = [
        'Registre uma despesa de 85 reais com Uber',
        'Recebi meu salário de 5000 reais',
        'Gastei 45 reais no McDonalds',
        'Qual é o meu saldo?',
        'Quanto eu gastei com alimentação?',
        'Onde eu mais gastei neste mês?',
        'Faça um resumo financeiro deste mês'
    ];

    EXAMPLES.forEach(e => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = e;
        b.onclick = () => { txt.value = e; txt.focus(); };
        document.getElementById('examples').appendChild(b);
    });

    function clearEmpty() {
        const e = log.querySelector('.empty');
        if (e) e.remove();
    }

    function addMessage(cls, who, text, heard, audioUrl) {
        clearEmpty();
        const div = document.createElement('div');
        div.className = 'msg ' + cls;
        div.innerHTML = '<div class="who"></div><p></p>';
        div.querySelector('.who').textContent = who;
        div.querySelector('p').textContent = text;
        if (heard) {
            const h = document.createElement('div');
            h.className = 'heard';
            h.textContent = '🎧 entendi: "' + heard + '"';
            div.appendChild(h);
        }
        if (audioUrl) {
            const a = document.createElement('audio');
            a.controls = true;
            a.src = audioUrl;
            div.appendChild(a);
            a.play().catch(() => {});
        }
        log.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return div;
    }

    async function readError(response) {
        try {
            const body = await response.json();
            return body.message || ('HTTP ' + response.status);
        } catch {
            return 'HTTP ' + response.status;
        }
    }

    async function sendText() {
        const message = txt.value.trim();
        if (!message) return;

        addMessage('user', 'Você', message);
        txt.value = '';
        sendBtn.disabled = true;
        const pending = addMessage('ai', 'SmartBudget AI', 'pensando…');

        try {
            const response = await fetch(API + '/assistant/message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            if (!response.ok) throw new Error(await readError(response));
            const data = await response.json();
            pending.querySelector('p').textContent = data.message;
        } catch (e) {
            pending.className = 'msg err';
            pending.querySelector('p').textContent = e.message;
        } finally {
            sendBtn.disabled = false;
        }
    }

    sendBtn.onclick = sendText;
    txt.onkeydown = e => { if (e.key === 'Enter') sendText(); };

    let recorder = null;
    let chunks = [];

    function extensionFor(mimeType) {
        if (mimeType.includes('webm')) return 'webm';
        if (mimeType.includes('ogg')) return 'ogg';
        if (mimeType.includes('mp4')) return 'mp4';
        return 'webm';
    }

    micBtn.onclick = async () => {
        if (recorder && recorder.state === 'recording') {
            recorder.stop();
            return;
        }

        if (!navigator.mediaDevices || !window.MediaRecorder) {
            micHint.textContent = 'Este navegador não suporta gravação. Use Chrome ou Edge.';
            return;
        }

        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch {
            micHint.textContent = 'Permissão de microfone negada. Libere o acesso e tente de novo.';
            return;
        }

        chunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

        recorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            micBtn.classList.remove('rec');
            micBtn.textContent = '🎙️ Gravar comando de voz';
            micBtn.disabled = true;
            micHint.textContent = 'Transcrevendo e consultando…';

            const type = recorder.mimeType || 'audio/webm';
            const blob = new Blob(chunks, { type });
            const form = new FormData();
            form.append('file', blob, 'comando.' + extensionFor(type));

            const pending = addMessage('ai', 'SmartBudget AI', 'processando o áudio…');

            try {
                const response = await fetch(API + '/assistant/audio', { method: 'POST', body: form });
                if (!response.ok) throw new Error(await readError(response));
                const data = await response.json();

                pending.querySelector('p').textContent = data.message;
                const heard = document.createElement('div');
                heard.className = 'heard';
                heard.textContent = '🎧 entendi: "' + data.transcription + '"';
                pending.appendChild(heard);

                if (data.audioBase64) {
                    const bytes = Uint8Array.from(atob(data.audioBase64), c => c.charCodeAt(0));
                    const url = URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }));
                    const player = document.createElement('audio');
                    player.controls = true;
                    player.src = url;
                    pending.appendChild(player);
                    player.play().catch(() => {});
                }
            } catch (e) {
                pending.className = 'msg err';
                pending.querySelector('p').textContent = e.message;
            } finally {
                micBtn.disabled = false;
                micHint.textContent = 'Clique, fale e clique de novo para enviar.';
            }
        };

        recorder.start();
        micBtn.classList.add('rec');
        micBtn.textContent = '⏹️ Parar e enviar';
        micHint.textContent = 'Gravando… fale seu comando.';
    };

    (async () => {
        try {
            const r = await fetch(API + '/finance/balance');
            if (!r.ok) throw new Error();
            const b = await r.json();
            const saldo = Number(b.netBalance).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            dot.className = 'dot on';
            statusText.textContent = 'API conectada — saldo atual ' + saldo;
        } catch {
            dot.className = 'dot off';
            statusText.textContent = 'API não respondeu. A aplicação está rodando?';
        }
    })();
</script>
</body>
</html>
