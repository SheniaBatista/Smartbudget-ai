spring.application.name=smart-budget-ai
server.port=${SMARTBUDGET_PORT:8081}

spring.datasource.url=jdbc:mysql://localhost:${SMARTBUDGET_DB_PORT:3308}/smart_budget?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=app
spring.datasource.password=app

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start_only

spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.prompt=Audio em portugues brasileiro sobre financas pessoais, com valores em reais, categorias de gasto e nomes de estabelecimentos.

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=nova
spring.ai.openai.audio.speech.options.speed=1.0
spring.ai.openai.audio.speech.options.response-format=mp3

spring.ai.tools.throw-exception-on-error=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

smartbudget.assistant.max-audio-size=20MB
smartbudget.assistant.speech-enabled=true

logging.level.com.smartbudget=INFO
logging.level.org.springframework.ai=INFO
